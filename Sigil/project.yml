name: Sigil
options:
  bundleIdPrefix: art.sigil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Sigil:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.sigil.app
        PRODUCT_NAME: Sigil
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        # Unsigned by design — see scripts/build_ipa.sh
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: ""
